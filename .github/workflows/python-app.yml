name: BearVision 3 CI

on:
  push:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  behavioural-gate:
    runs-on: ubuntu-latest
    concurrency:
      group: bearvision-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked development environment
        uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Lint active package
        run: uv run ruff check src tests/remake
      - name: Type-check active package
        run: uv run mypy
      - name: Run behavioural gate
        run: uv run pytest --cov=bearvision --cov-report=term-missing
      - name: Build package
        run: uv build
