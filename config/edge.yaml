config_schema_version: "3.0"
config_kind: bearvision-edge
recording:
  post_detection_duration_s: 5.0
  hindsight_enabled: true
clip_extraction:
  engine: ffmpeg
  video_codec: libx264
  audio_codec: aac
  preset: veryfast
  crf: 20
virtual_cameraman:
  sample_fps: 10.0
  crop_width_ratio: 0.5
  output_width_px: 960
  output_height_px: 540
  output_crf: 18
detection:
  enabled: true
  model: yolov8n
  confidence_threshold: 0.5
  cooldown_s: 2.0
performance:
  max_fps: 30
  buffer_drain: true
  callback_queue_size: 5
error_recovery:
  max_restarts: 5
  restart_delay_s: 2.0
features:
  ble_logging: true
  cloud_upload: false
storage:
  provider: box
  root_folder: bearvision_files
  credential_env: STORAGE_CREDENTIALS_B64
  secondary_credential_env: STORAGE_CREDENTIALS_B64_2
system:
  log_level: DEBUG
  device_id: edge-1
