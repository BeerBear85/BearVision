[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bearvision"
version = "3.0.0.dev0"
description = "Spec-driven BearVision edge system and behavioural simulator"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "opencv-python-headless>=4.10,<5",
    "ffmpeg-binaries-compat>=1.1,<2",
    "bleak>=0.22,<2",
    "open-gopro>=0.18,<1",
    "boxsdk[jwt]>=3.9,<4",
    "truststore>=0.10,<1; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7", "opencv-python>=4.10,<5"]
training = ["numpy>=2,<3", "scipy>=1.14,<2", "ultralytics>=8.3,<9"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
bearvision-edge = "bearvision.cli:edge_main"
bearvision-simulate = "bearvision.cli:simulate_main"
bearvision-migrate-config = "bearvision.config.migrate:main"
bearvision-generate-blender-scenario = "bearvision.simulation.blender_scenario:main"
bearvision-server = "bearvision.server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["code", "pretraining", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
packages = ["bearvision"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["bearvision"]
branch = true
omit = [
    "src/bearvision/integrations/*",
    "src/bearvision/adapters/opencv_frames.py",
    "src/bearvision/cli.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
