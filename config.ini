[WEB_STORIES]
storage_service = box

[STORAGE_COMMON]
secret_key_name = STORAGE_CREDENTIALS_B64
secret_key_name_2 = STORAGE_CREDENTIALS_B64_2

[BOX]
root_folder = bearvision_files

[ANNOTATION_GUI]
preview_width = 280
# [pixels] Maximum width for preview display
preview_panel_width = 300
# [pixels] Width of the preview panel
preview_image_min_height = 200
# [pixels] Minimum height for frame preview
trajectory_image_min_height = 150
# [pixels] Minimum height for trajectory preview

[EDGE_APPLICATION]
# YOLO Detection Settings
yolo_enabled = true
# Set to false to disable YOLO detection (will keep state in LOOKING_FOR_WAKEBOARDER)
yolo_model = yolov8n
# Options: yolov8n, yolov8s, yolov8m, yolov8l, yolov8x

# Recording Settings
recording_duration = 30.0
# Duration in seconds for each recording clip

# Error Recovery Settings
max_error_restarts = 3
# Maximum number of automatic restart attempts on error
error_restart_delay = 2.0
# Delay in seconds before attempting restart after error

# Thread Settings
enable_ble_logging = true
# Enable/disable BLE beacon logging thread
enable_post_processing = true
# Enable/disable video post-processing thread
enable_cloud_upload = true
# Enable/disable cloud upload thread

# State Machine Behavior
hindsight_mode_enabled = true
# Enable/disable hindsight mode on GoPro
preview_stream_enabled = true
# Enable/disable GoPro preview stream processing

# Detection Settings
detection_confidence_threshold = 0.5
# Minimum confidence for YOLO person detection (0.0-1.0)
detection_cooldown = 2.0
# Minimum seconds between valid detections

# Stream Performance Settings
stream_max_fps = 30
# Maximum frame processing rate (frames per second)
stream_buffer_drain = true
# Enable buffer draining to get latest frame and reduce lag
stream_max_lag_ms = 1000
# Maximum acceptable lag in milliseconds before dropping frames
stream_callback_queue_size = 5
# Size of frame callback queue (1-10, smaller = less latency)
