scenario_schema_version: "3.0"
name: wakeboard-testmovie5-two-riders-yolo
seed: 42
duration_s: 13.534

components:
  frames: video
  detector: yolo
  bear_tag: synthetic
  camera: recorded_video
  storage: memory

video:
  path: tests/data/TestMovie5_two_persons.mp4
  sample_fps: 5

detector:
  model: yolov8n
  confidence_threshold: 0.6

synthetic_bear_tags:
  # Rider 1 crosses the frame around 1.3-3.2 s. The tag stays active through
  # the resulting five-second clip because the rider continues out of frame.
  - tag_id: bear_tag_666
    rider_id: rider-testmovie5-1
    start_s: 0
    end_s: 13.5
    sample_rate_hz: 10
    rssi_dbm: -82
    baseline_acceleration_mps2:
      x: 0
      y: 0
      z: 9.80665
    motion_windows:
      - start_s: 1.0
        end_s: 7.8
        rssi_dbm: -64
        acceleration_mps2:
          x: 4.8
          y: 2.6
          z: 19.2
  # A unique tag is required for rider 2; sharing bear_tag_666 would make
  # identity assignment ambiguous and would not model physical BearTags.
  - tag_id: bear_tag_667
    rider_id: rider-testmovie5-2
    start_s: 0
    end_s: 13.5
    sample_rate_hz: 10
    rssi_dbm: -82
    baseline_acceleration_mps2:
      x: 0
      y: 0
      z: 9.80665
    motion_windows:
      - start_s: 11.4
        end_s: 13.5
        rssi_dbm: -66
        acceleration_mps2:
          x: 4.4
          y: 2.3
          z: 18.9

timeline: []
faults: {}
expect:
  rider_ids:
    - rider-testmovie5-1
    - rider-testmovie5-2
  bear_tag_ids:
    - bear_tag_666
    - bear_tag_667
  assignment_status: assigned
  capture_triggered: true
  clip_uploaded: true
  minimum_person_detections: 2
  first_detection_between_s: [2.3, 2.5]
