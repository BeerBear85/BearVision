[pytest]
addopts = -ra
testpaths = tests/remake
pythonpath = src
python_files = test_*.py
norecursedirs = archived legacy .git .venv temp tools code pretraining
markers =
    end2end: tests that process materialized real-video fixtures through the complete local pipeline
    box_integration: tests that make real network calls to Box when credentials are available
    physical_ble: tests that require physical BLE hardware (use --run-physical-ble flag to enable)
    physical_gopro: tests that require physical GoPro hardware (use --run-physical-gopro flag to enable)
