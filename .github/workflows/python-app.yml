name: BearVision 3 CI

on:
  push:
    branches: ["master", "codex/remake-foundation"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BearVision 3
        run: python -m pip install -e ".[dev]"
      - name: Run behavioural gate
        run: python -m pytest tests/remake
