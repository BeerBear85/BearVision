config_schema_version: "2.0"
config_kind: bearvision-ble-test
ble:
  scan_timeout: 0.0
  movement_threshold: 0.2
  rssi_config_path: rssi_distance.ini
gui:
  window_title: BearVision BLE Tag Manual Test
  window_width: 800
  window_height: 600
  log_max_lines: 1000
  log_font_family: Consolas
  log_font_size: 9
  auto_scroll: true
  show_timestamp: true
  show_address: true
  show_name: true
  show_rssi: true
  show_distance: true
  show_battery: true
  show_accelerometer: true
  show_movement: true
  background_color: "#ffffff"
  text_color: "#000000"
  moving_tag_color: "#ff0000"
logging:
  level: DEBUG
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
