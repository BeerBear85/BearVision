name: BearVision 3 CI

on:
  push:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  behavioural-gate:
    runs-on: ubuntu-latest
    concurrency:
      group: bearvision-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Materialize behavioural media fixture
        run: git lfs pull --include="tests/data/preview_low.mp4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Lint active package
        run: uv run ruff check src tests/remake tests/vision tests/end2end
      - name: Type-check active package
        run: uv run mypy
      - name: Verify local Edge-to-server package handoff
        run: uv run pytest tests/remake/test_local_end_to_end.py tests/remake/test_box_job_queue.py
      - name: Run behavioural gate
        run: uv run pytest
      - name: Build package
        run: uv build
      - name: Validate Linux Edge provisioning
        run: |
          bash -n scripts/setup-raspberry-pi.sh
          shellcheck scripts/setup-raspberry-pi.sh

  vision-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Materialize only required vision assets
        run: git lfs pull --include="code/dnn_models/yolov8n.onnx,tests/end2end/images/*.jpg,tests/data/*.mp4,tests/end2end/input_video/*.avi"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Run behavioural and vision suites with combined coverage
        run: |
          uv run coverage erase
          uv run coverage run --parallel-mode -m pytest
          uv run coverage run --parallel-mode -m pytest tests/vision tests/end2end -q
          uv run coverage combine
          uv run coverage report
          uv run coverage xml -o coverage-${{ matrix.os }}.xml
      - name: Publish platform coverage data
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.xml

  offline-yolo:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra training --extra gui
      - name: Lint offline annotation and fine-tuning tools
        run: uv run ruff check pretraining tests/offline_yolo
      - name: Verify offline annotation and fine-tuning tools
        run: uv run pytest tests/offline_yolo -q

  edge-control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/edge-control
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/edge-control/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/edge-control/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  server-control:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/server-control
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/server-control/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/server-control/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
