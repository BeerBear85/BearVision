name: BearVision 3 CI

on:
  push:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  behavioural-gate:
    runs-on: ubuntu-latest
    concurrency:
      group: bearvision-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked development environment
        uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Lint active package
        run: uv run ruff check src tests/remake tests/vision
      - name: Type-check active package
        run: uv run mypy
      - name: Run behavioural gate
        run: uv run pytest --cov=bearvision --cov-report=term-missing
      - name: Build package
        run: uv build

  vision-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Materialize only required vision assets
        run: git lfs pull --include="code/dnn_models/yolov8n.onnx,test/images/*.jpg,tests/images/*.jpg,tests/data/preview_low.mp4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra edge --extra dev
      - name: Run behavioural and vision suites with combined coverage
        run: |
          uv run coverage erase
          uv run coverage run --parallel-mode -m pytest
          uv run coverage run --parallel-mode -m pytest tests/vision -q
          uv run coverage combine
          uv run coverage report
          uv run coverage xml -o coverage-${{ matrix.os }}.xml
      - name: Publish platform coverage data
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.xml

  edge-control:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/edge-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/edge-control/pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
