config_schema_version: "1.0"
config_kind: bearvision-server
assignment:
  minimum_observation_count: 2
  minimum_motion_delta_mps2: 2.0
  motion_full_scale_mps2: 12.0
  minimum_rssi_dbm: -85
  rssi_full_scale_dbm: -40
  motion_weight: 0.7
  rssi_weight: 0.3
  minimum_score_margin: 0.12
worker:
  poll_interval_s: 5.0
  retry_delay_s: 2.0
admin:
  host: 127.0.0.1
  port: 4320
storage:
  provider: box
  root_folder: bearvision_files
  credential_env: STORAGE_CREDENTIALS_B64
  secondary_credential_env: STORAGE_CREDENTIALS_B64_2
registry_path: data/server/user-registry.json
scratch_dir: temp/server-box
local_queue_root: null
