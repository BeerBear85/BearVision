# Camera setup for wakeboard_fs360_60fps.mp4
# Generated from D:/Blender/wakeboard_scene.blend

camera:
  object_name: Camera
  static: true
  comment: camera does not move; framing comes entirely from the Track To constraint

  transform_world:
    location_m:
      x: -8.0
      y: -30.5
      z: 3.0
    rotation_euler_deg:   # result of the constraint, not user-set
      x: 88.212
      y: -0.0
      z: -17.813
    rotation_mode: XYZ
    forward_axis: [0.3058, 0.9516, -0.0312]
    scale: [1.0, 1.0, 1.0]

  lens:
    type: PERSP
    focal_length_mm: 50.0
    sensor_fit: AUTO
    sensor_width_mm: 36.0
    sensor_height_mm: 24.0
    fov_horizontal_deg: 39.598
    fov_vertical_deg: 22.895
    shift_x: 0.0
    shift_y: 0.0
    clip_start_m: 0.1
    clip_end_m: 4000.0

  depth_of_field:
    enabled: false
    focus_object: null
    focus_distance_m: 10.0
    f_stop: 2.8
    blades: 0

  aim:
    constraint:
      name: Track To
      type: TRACK_TO
      target: CamTarget
      track_axis: TRACK_NEGATIVE_Z
      up_axis: UP_Y
      influence: 1.0
    target_object: CamTarget
    target_location_m: [1.8, 0.0, 2.0]
    target_animated: false
    distance_to_target_m: 32.051

  animation:
    object_animated: false
    lens_animated: false
    keyframe_count: 0

render:
  resolution_px: [1920, 1080]
  resolution_percent: 100
  fps: 60
  frame_start: 1
  frame_end: 303
  duration_s: 5.05
  engine: BLENDER_EEVEE
  motion_blur: false
  view_transform: AgX
  look: None
  exposure: -0.5

subject_distance:   # straight-line camera-to-rider distance
  - marker: start
    frame: 1
    rider_world_m: [-22.5, 0.0, 0.008]
    distance_m: 33.9
  - marker: hard_edge
    frame: 103
    rider_world_m: [-8.661, -2.966, -0.053]
    distance_m: 27.71
  - marker: ramp_entry
    frame: 139
    rider_world_m: [-3.371, -4.0, 0.04]
    distance_m: 27.06
  - marker: takeoff
    frame: 178
    rider_world_m: [1.6, -4.0, 1.3]
    distance_m: 28.24
  - marker: apex
    frame: 203
    rider_world_m: [4.808, -4.0, 1.551]
    distance_m: 29.47
  - marker: landing
    frame: 229
    rider_world_m: [8.145, -4.0, 0.0]
    distance_m: 31.18
  - marker: end
    frame: 303
    rider_world_m: [17.642, -4.0, -0.01]
    distance_m: 37.0

notes:
  - Static 50 mm framing; the rider crosses the frame rather than being followed.
  - Motion blur is disabled; at 7-11 m/s each frame renders as a freeze.
  - Depth of field is off, so the whole depth of the scene is sharp.
